<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fit Tracker • Allenamento e Nutrizione</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#172235;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#12243d;color:white;padding:22px max(16px,calc((100vw - 1000px)/2))}header h1{margin:0;font-size:26px}header p{margin:6px 0 0;color:#b8cce2}main{max-width:1000px;margin:auto;padding:18px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}button,.btn{border:0;border-radius:10px;padding:10px 14px;background:#dfe8f3;color:#172235;font-weight:650;cursor:pointer}button.active,button.primary{background:#1667bd;color:white}.panel{background:white;border:1px solid #e0e7ef;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 3px 16px #17223509}h2{margin:0 0 14px;font-size:21px}h3{margin:12px 0 8px}label{display:block;font-size:13px;font-weight:600;margin:8px 0 4px}input,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;background:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}.stat{background:#eef5fc;padding:14px;border-radius:12px}.stat b{display:block;font-size:24px}.stat small{color:#5e6b7b}.muted{color:#617184;font-size:13px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.exercise{border-top:1px solid #e8edf4;padding:13px 0}.exercise:first-child{border-top:0}.setrow{display:grid;grid-template-columns:42px 1fr 1fr 1fr;gap:8px;align-items:end;margin:7px 0}.setrow label{margin:0}.setrow input{padding:8px}.foodrow{display:grid;grid-template-columns:2fr 1fr auto;gap:8px;align-items:end}.foodrow button{height:42px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #e8edf4;font-size:14px}th{color:#617184}.danger const today=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};let db;try{db=JSON.parse(localStorage.getItem(KEY))||{}}catch{db={}}db.workouts ||= [];db.food ||= [];db.body ||= [];db.targets ||= {kcal:2000,protein:145,carbs:215,fat:62};db.appleHealth ||= {days:{},workouts:[],importedAt:null};db.customFoods ||= [];db.foodPrefs ||= {};db.schedule ||= [1,0,3,2];let selectedDay=0,workDate=today(),foodDate=today(),bodyDate=today();const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Impossibile salvare: esporta subito un backup.')}};const el=id=>document.getElementById(id);const num=x=>Number(x)||0;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>Number(n).toLocaleString('it-IT',{maximumFractionDigits:1});function tabs(name){document.querySelectorAll('main section').forEach(e=>e.classList.toggle('hidden',e.id!==name));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));render(name)}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tabs(b.dataset.tab));function render(name){({dashboard:renderDashboard,workout:renderWorkout,food:renderFood,body:renderBody,health:renderHealth,settings:renderSettings})[name]()}function totals(date){return db.food.filter(f=>f.date===date).reduce((a,f)=>{for(let k of ['kcal','protein','carbs','fat'])a[k]+=num(f[k]);return a},{kcal:0,protein:0,carbs:0,fat:0})}
function renderDashboard(){let t=totals(today()),last=db.body.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];let count=db.workouts.filter(w=>{let d=new Date(w.date+'T12:00:00'),n=new Date();return (n-d)/864e5<=7 && (n-d)/864e5>=0}).length;el('dashboard').innerHTML=`<div class="panel"><h2>Oggi • ${today()}</h2><div class="stats"><div class="stat"><small>Calorie</small><b>${fmt(t.kcal)}</b><small>/ ${db.targets.kcal} kcal</small></div><div class="stat"><small>Proteine</small><b>${fmt(t.protein)} g</b><small>/ ${db.targets.protein} g</small></div><div class="stat"><small>Allenamenti ultimi 7 giorni</small><b>${count}</b><small>sedute registrate</small></div><div class="stat"><small>Ultimo girovita</small><b>${last?.waist?fmt(last.waist)+' cm':'—'}</b><small>${last?.date||'Nessun dato'}</small></div></div><h3>Obiettivi alimentari</h3><label>Calorie</label><progress value="${Math.min(t.kcal,db.targets.kcal)}" max="${db.targets.kcal}"></progress><label>Proteine</label><progress value="${Math.min(t.protein,db.targets.protein)}" max="${db.targets.protein}"></progress></div><div class="panel"><h2>Come usare l'app</h2><p>In <b>Allenamento</b> registri ogni serie, in <b>Alimentazione</b> aggiungi alimenti e grammi, in <b>Misure</b> registri peso e girovita. Puoi esportare i dati e condividerli in chat per analizzarli insieme.</p></div>`}
function exerciseArt(name){let n=name.toLowerCase(),kind=/lat machine|pushdown|corda|cavo|face pull/.test(n)?'cable':/press|pec deck|rematore macchina|leg curl/.test(n)?'machine':/panca|curl manubri|scrollate manubri|martello/.test(n)?'dumbbell':/leg press/.test(n)?'machine':/bilanciere/.test(n)?'barbell':'bench';let shapes={cable:'<rect x="13" y="9" width="8" height="78" rx="2"/><rect x="76" y="9" width="8" height="78" rx="2"/><path d="M17 12H80 M50 12V35 M34 36H66 M50 35V54"/><circle cx="50" cy="63" r="7"/><path d="M50 70V83 M50 74L36 85 M50 74L64 85"/>',machine:'<path d="M15 85V13H30 M80 85V13H65 M20 85H83"/><rect x="33" y="48" width="33" height="10" rx="3"/><path d="M45 48V28H64 M66 55V83 M32 57V83 M29 31H73"/><circle cx="51" cy="36" r="6"/>',dumbbell:'<path d="M17 78H84 M30 78L42 50 M42 50L65 50 M65 50L75 78"/><circle cx="52" cy="28" r="7"/><path d="M52 36L52 52 M52 40L34 34 M52 40L70 34 M52 52L38 69 M52 52L66 69 M23 34H40 M64 34H81"/><path d="M23 27V41 M81 27V41"/>',barbell:'<path d="M8 32H93 M20 22V42 M26 24V40 M75 24V40 M81 22V42"/><circle cx="51" cy="53" r="7"/><path d="M51 60V77 M51 64L35 75 M51 64L67 75"/>',bench:'<path d="M20 75H80 M33 75L44 48H73 M73 48L83 75"/><circle cx="49" cy="27" r="8"/><path d="M49 35V53 M49 40L35 52 M49 40L63 52"/>'};return `<svg viewBox="0 0 100 96" role="img" aria-label="Illustrazione schematica dell'attrezzo" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="#24649e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">${shapes[kind]}</g></svg>`}
function renderWorkout(){let day=days[db.schedule[selectedDay]];const weekNames=['Lunedì','Martedì','Giovedì','Venerdì'];const sessionLabel=i=>weekNames[i]+' • '+days[db.schedule[i]].name.split(' • ')[1];let existing=db.workouts.find(w=>w.date===workDate&&w.day===selectedDay);el('workout').innerHTML=`<div class="panel"><h2>Diario allenamento</h2><div class="grid"><div><label>Data</label><input id="wdate" type="date" value="${workDate}"></div><div><label>Seduta</label><select id="wday">${days.map((d,i)=>`<option value="${i}" ${i===selectedDay?'selected':''}>${esc(sessionLabel(i))}</option>`).join('')}</select></div></div><div class="row" style="margin-top:12px"><label for="swapday" style="margin:0">Inverti questa seduta con:</label><select id="swapday" style="width:auto"><option value="">Scegli un giorno…</option>${days.map((d,i)=>i===selectedDay?'':`<option value="${i}">${esc(sessionLabel(i))}</option>`).join('')}</select><button id="swapwork" type="button">Inverti scheda</button></div><p class="muted">La modifica resta salvata e puoi cambiare i giorni quando vuoi. Le sedute già registrate rimangono nello storico.</p><p class="muted">Peso in kg per manubrio quando usi i manubri. Inserisci 0 kg per corpo libero. RIR = ripetizioni ancora possibili.</p><div id="exercises">${day.ex.map((e,i)=>`<div class="exercise"><div class="exercise-head"><div class="exercise-art">${exerciseArt(e[0])}</div><div><b>${esc(e[0])}</b><div class="muted">${e[1]} serie × ${e[2]} rip. • recupero ${e[3]} s</div></div></div>${Array.from({length:e[1]},(_,j)=>{let v=existing?.sets?.[i]?.[j]||{};return `<div class="setrow"><span>${j+1}.</span><div><label>Kg</label><input inputmode="decimal" type="number" step="0.5" min="0" data-e="${i}" data-s="${j}" data-k="kg" value="${v.kg??''}" placeholder="kg"></div><div><label>Rip.</label><input inputmode="numeric" type="number" min="0" data-e="${i}" data-s="${j}" data-k="reps" value="${v.reps??''}" placeholder="rep"></div><div><label>RIR</label><input inputmode="numeric" type="number" min="0" max="10" data-e="${i}" data-s="${j}" data-k="rir" value="${v.rir??''}" placeholder="RIR"></div></div>`}).join('')}</div>`).join('')}</div><button class="primary" id="savework">Salva allenamento</button><span id="wmsg" class="muted"></span></div><div class="panel"><h2>Storico recente</h2><div id="whistory"></div></div>`;el('wdate').onchange=e=>{workDate=e.target.value;renderWorkout()};el('wday').onchange=e=>{selectedDay=+e.target.value;renderWorkout()};el('swapwork').onclick=()=>{let other=Number(el('swapday').value);if(el('swapday').value===''||other===selectedDay)return;[db.schedule[selectedDay],db.schedule[other]]=[db.schedule[other],db.schedule[selectedDay]];save();renderWorkout()};el('savework').onclick=()=>{let sets=day.ex.map(e=>Array.from({length:e[1]},()=>({})));el('exercises').querySelectorAll('input').forEach(i=>{if(i.value!=='')sets[+i.dataset.e][+i.dataset.s][i.dataset.k]=num(i.value)});if(!sets.flat().some(s=>s.reps>0)){alert('Inserisci almeno una serie con ripetizioni.');return}db.workouts=db.workouts.filter(w=>!(w.date===workDate&&w.day===selectedDay));db.workouts.push({date:workDate,day:selectedDay,sessionName:sessionLabel(selectedDay),sets});save();renderWorkout();el('wmsg').textContent=' ✓ Salvato'};el('whistory').innerHTML=db.workouts.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,12).map(w=>`<p><b>${w.date}</b> • ${esc(w.sessionName||days[w.day]?.name||'Seduta')} • ${w.sets.flat().filter(s=>s.reps>0).length} serie <button data-load="${w.date}|${w.day}">Apri</button></p>`).join('')||'<p class="muted">Nessun allenamento salvato.</p>';el('whistory').querySelectorAll('button').forEach(b=>b.onclick=()=>{[workDate,selectedDay]=b.dataset.load.split('|');selectedDay=+selectedDay;renderWorkout()})}

 el('fdate').onchange=e=>{foodDate=e.target.value;renderFood()};
 el('food').querySelectorAll('[data-meal]').forEach(b=>b.onclick=()=>{activeMeal=b.dataset.meal;foodQuery='';renderFood();el('food-entry').scrollIntoView({behavior:'smooth',block:'start'})});
 el('food').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{db.food=db.food.filter(f=>String(f.id)!==b.dataset.remove);save();renderFood()});
 const sel=el('foodsel'),qty=el('foodqty');
 function updatePreview(){let f=foodById(foodChoice),n=num(qty.value),g=f.kind==='piece'?n*f.portion:n,m=f.kind==='piece'?n:g/f.portion;el('qtylabel').textContent=f.kind==='piece'?'Numero di '+f.unit:'Quantità (g)';el('foodpreview').innerHTML=`<b>${fmt(g)} g</b> · ${fmt(f.k*m)} kcal · <b>${fmt(f.p*m)} g proteine</b><br><small>Carboidrati ${fmt(f.c*m)} g · Grassi ${fmt(f.f*m)} g</small>`}
 function resetQuantity(){let f=foodById(foodChoice);foodAmount=db.foodPrefs[foodChoice]??(f.kind==='piece'?1:f.portion);qty.value=foodAmount;qty.step=f.kind==='piece'?'1':'0.5';updatePreview()}
 sel.onchange=()=>{foodChoice=sel.value;resetQuantity()};qty.oninput=()=>{foodAmount=num(qty.value);updatePreview()};el('quickplus').onclick=()=>{qty.value=num(qty.value)+1;foodAmount=num(qty.value);updatePreview()};
 el('foodsearch').oninput=e=>{foodQuery=e.target.value;let matches=allFoods().filter(f=>f.name.toLowerCase().includes(foodQuery.toLowerCase()));sel.innerHTML=matches.map(f=>`<option value="${esc(f.id)}">${esc(f.name)}</option>`).join('');if(matches.length){foodChoice=matches[0].id;resetQuantity()}else el('foodpreview').textContent='Nessun prodotto trovato. Puoi aggiungerlo al tuo archivio.'};
 el('addfood').onclick=()=>{let f=foodById(foodChoice),n=num(qty.value);if(!f||n<=0||f.kind==='piece'&&!Number.isInteger(n)){alert('Inserisci una quantità valida.');return}let g=f.kind==='piece'?n*f.portion:n,m=f.kind==='piece'?n:g/f.portion;db.food.push({id:Date.now()+Math.random(),date:foodDate,meal:activeMeal,name:f.name,grams:g,kcal:+(f.k*m).toFixed(1),protein:+(f.p*m).toFixed(1),carbs:+(f.c*m).toFixed(1),fat:+(f.f*m).toFixed(1)});db.foodPrefs[foodChoice]=n;save();renderFood()};
 el('savecustom').onclick=()=>{let name=el('customname').value.trim(),kind=el('customkind').value,portion=kind==='piece'?num(el('customportion').value):100,unit=kind==='piece'?el('customunit').value.trim():'g';if(!name||portion<=0||!unit||['customkcal','customprotein','customcarbs','customfat'].some(id=>el(id).value===''||num(el(id).value)<0)){alert('Completa nome, quantità per pezzo e valori nutrizionali.');return}let f={id:foodEditing||'custom-'+Date.now(),name,kind,unit,portion,k:num(el('customkcal').value)*portion/100,p:num(el('customprotein').value)*portion/100,c:num(el('customcarbs').value)*portion/100,f:num(el('customfat').value)*portion/100};db.customFoods=db.customFoods.filter(x=>x.id!==f.id);db.customFoods.unshift(f);foodChoice=f.id;foodEditing=null;foodQuery='';save();renderFood();el('food-entry').scrollIntoView({behavior:'smooth'})};
 el('food').querySelectorAll('[data-editcustom]').forEach(b=>b.onclick=()=>{let f=foodById(b.dataset.editcustom);foodEditing=f.id;el('customname').value=f.name;el('customkind').value=f.kind;el('customunit').value=f.unit;el('customportion').value=f.portion;for(let [id,k] of [['customkcal','k'],['customprotein','p'],['customcarbs','c'],['customfat','f']])el(id).value=+(f[k]*100/f.portion).toFixed(3);el('customname').scrollIntoView({behavior:'smooth'})});
 el('food').querySelectorAll('[data-delcustom]').forEach(b=>b.onclick=()=>{if(confirm('Eliminare il prodotto dall’archivio? Le registrazioni precedenti resteranno.')){db.customFoods=db.customFoods.filter(f=>f.id!==b.dataset.delcustom);save();renderFood()}});
 resetQuantity();}
function renderBody(){let current=db.body.find(x=>x.date===bodyDate);el('body').innerHTML=`<div class="panel"><h2>Peso e girovita</h2><div class="grid"><div><label>Data</label><input id="bdate" type="date" value="${bodyDate}"></div><div><label>Peso (kg)</label><input id="weight" type="number" step="0.1" min="0" value="${current?.weight??''}"></div><div><label>Girovita (cm)</label><input id="waist" type="number" step="0.1" min="0" value="${current?.waist??''}"></div></div><p><button class="primary" id="savebody">Salva misure</button></p></div><div class="panel"><h2>Storico misure</h2><table><thead><tr><th>Data</th><th>Peso</th><th>Girovita</th></tr></thead><tbody>${db.body.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(b=>`<tr><td>${b.date}</td><td>${b.weight?fmt(b.weight)+' kg':'—'}</td><td>${b.waist?fmt(b.waist)+' cm':'—'}</td></tr>`).join('')||'<tr><td colspan="3">Nessuna misura.</td></tr>'}</tbody></table></div>`;el('bdate').onchange=e=>{bodyDate=e.target.value;renderBody()};el('savebody').onclick=()=>{let weight=num(el('weight').value),waist=num(el('waist').value);if(!weight&&!waist){alert('Inserisci almeno una misura');return}db.body=db.body.filter(b=>b.date!==bodyDate);db.body.push({date:bodyDate,weight,waist});save();renderBody()}}

// Importazione locale dei dati Apple Salute (nessun caricamento su server).
function renderHealth(){
 const h=db.appleHealth||{days:{},workouts:[]},dates=Object.keys(h.days||{}).sort().reverse();
 const recent=dates.slice(0,21);const workouts=(h.workouts||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,25);
 el('health').innerHTML=`<div class="panel"><h2>⌚ Apple Watch · Apple Salute</h2><p>Importa i dati reali esportati dall'app <b>Salute</b> sul tuo iPhone. L'importazione è manuale e rimane sul dispositivo: non è una connessione diretta a HealthKit.</p><p><b>Come esportare:</b> Salute → foto profilo → <b>Esporta tutti i dati sanitari</b> → Salva su File. Apri il file ZIP nell'app File per estrarlo, poi seleziona <b>export.xml</b> qui sotto.</p><label>Seleziona export.xml <input id="health-file" type="file" accept=".xml,text/xml,application/xml"></label><p id="health-status" class="muted">${h.importedAt?'Ultima importazione: '+esc(h.importedAt):'Nessuna importazione effettuata.'}</p><p class="muted">Sono importati passi, calorie attive, frequenza cardiaca, distanza a piedi/corsa e allenamenti, se presenti nel file. I dati non modificano automaticamente il diario alimentare o le serie in palestra. Il file XML può essere molto grande: l'elaborazione potrebbe richiedere tempo.</p></div><div class="panel"><h2>Ultimi dati giornalieri</h2><div style="overflow-x:auto"><table><thead><tr><th>Data</th><th>Passi</th><th>Kcal attive</th><th>FC media</th><th>Km</th></tr></thead><tbody>${recent.map(d=>{let x=h.days[d];return `<tr><td>${esc(d)}</td><td>${fmt(x.steps||0)}</td><td>${fmt(x.active||0)}</td><td>${x.hrCount?fmt(x.hrSum/x.hrCount)+' bpm':'—'}</td><td>${fmt(x.distance||0)}</td></tr>`}).join('')||'<tr><td colspan="5">Nessun dato importato.</td></tr>'}</tbody></table></div></div><div class="panel"><h2>Allenamenti Apple Watch</h2><p class="muted">Separati dalle serie e dai pesi registrati in Fit Tracker, per evitare doppioni.</p><div style="overflow-x:auto"><table><thead><tr><th>Data</th><th>Tipo</th><th>Durata</th><th>Calorie</th></tr></thead><tbody>${workouts.map(w=>`<tr><td>${esc(w.date)}</td><td>${esc(w.type)}</td><td>${fmt(w.minutes)} min</td><td>${fmt(w.calories)} kcal</td></tr>`).join('')||'<tr><td colspan="4">Nessun allenamento importato.</td></tr>'}</tbody></table></div></div>`;
 el('health-file').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;const status=el('health-status');status.textContent='Lettura del file in corso…';await new Promise(r=>setTimeout(r,40));try{
 if(f.size>100*1024*1024)throw Error('File superiore a 100 MB: esportazione troppo grande per questa versione.');
 const txt=await f.text();if(!txt.includes('<HealthData'))throw Error('Seleziona export.xml estratto dall’esportazione Apple Salute.');
 status.textContent='Analisi dei dati in corso…';await new Promise(r=>setTimeout(r,40));
 const xml=new DOMParser().parseFromString(txt,'application/xml');if(xml.querySelector('parsererror'))throw Error('XML non valido.');
 const days={};const getDay=d=>days[d]||(days[d]={steps:0,active:0,hrSum:0,hrCount:0,distance:0});
 const types={HKQuantityTypeIdentifierStepCount:'steps',HKQuantityTypeIdentifierActiveEnergyBurned:'active',HKQuantityTypeIdentifierHeartRate:'hr',HKQuantityTypeIdentifierDistanceWalkingRunning:'distance'};
 for(const r of xml.getElementsByTagName('Record')){const k=types[r.getAttribute('type')];if(!k)continue;const date=(r.getAttribute('startDate')||'').slice(0,10);if(!/^\d{4}-\d\d-\d\d$/.test(date))continue;const value=Number(r.getAttribute('value'));if(!Number.isFinite(value)||value<0)continue;const unit=r.getAttribute('unit')||'';const d=getDay(date);
 if(k==='steps')d.steps+=value;
 if(k==='active'){if(unit==='kcal')d.active+=value;else if(unit==='kJ')d.active+=value/4.184;}
 if(k==='hr'&&unit==='count/min'){d.hrSum+=value;d.hrCount++}
 if(k==='distance'){if(unit==='km')d.distance+=value;else if(unit==='m')d.distance+=value/1000;else if(unit==='mi')d.distance+=value*1.609344;}
 }
 const ws=[];for(const w of xml.getElementsByTagName('Workout')){const date=(w.getAttribute('startDate')||'').slice(0,10);if(!/^\d{4}-\d\d-\d\d$/.test(date))continue;const raw=w.getAttribute('workoutActivityType')||'Allenamento';const unit=w.getAttribute('durationUnit')||'min';let mins=Number(w.getAttribute('duration'))||0;if(unit==='sec'||unit==='s')mins/=60;if(unit==='hr')mins*=60;let calories=Number(w.getAttribute('totalEnergyBurned'))||0;if(w.getAttribute('totalEnergyBurnedUnit')==='kJ')calories/=4.184;ws.push({date,type:raw.replace('HKWorkoutActivityType','').replace(/([a-z])([A-Z])/g,'$1 $2'),minutes:Math.round(mins*10)/10,calories:Math.round(calories)})}
 db.appleHealth={days,workouts:ws,importedAt:new Date().toLocaleString('it-IT')};save();renderHealth();alert('Importati '+Object.keys(days).length+' giorni e '+ws.length+' allenamenti.');
 }catch(e){status.textContent='Importazione non riuscita: '+e.message}}
}

function renderSettings(){el('settings').innerHTML=`<div class="panel"><h2>Obiettivi giornalieri</h2><div class="grid">${[['kcal','Calorie (kcal)'],['protein','Proteine (g)'],['carbs','Carboidrati (g)'],['fat','Grassi (g)']].map(([k,n])=>`<div><label>${n}</label><input type="number" min="0" id="target-${k}" value="${db.targets[k]}"></div>`).join('')}</div><p><button class="primary" id="savetargets">Salva obiettivi</button></p><p class="muted">Valori iniziali indicativi, da personalizzare in base ai progressi.</p></div><div class="panel"><h2>Backup e condivisione</h2><p>I dati rimangono nel browser. Esporta un file JSON per non perderli e, se vuoi, caricalo in questa chat per farmi analizzare progressi e alimentazione.</p><div class="row"><button class="primary" id="export">Esporta backup JSON</button><label style="margin:0">Importa backup <input id="import" type="file" accept="application/json,.json"></label></div><p class="muted">L'importazione sostituisce i dati attuali. Il file può contenere dati personali: condividilo soltanto se desideri farli analizzare.</p><button class="danger" id="reset">Cancella tutti i dati locali</button></div>`;el('savetargets').onclick=()=>{for(let k of ['kcal','protein','carbs','fat'])db.targets[k]=num(el('target-'+k).value);save();alert('Obiettivi salvati')};el('export').onclick=()=>{let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fit-tracker-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};el('import').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let o=JSON.parse(await f.text());if(!Array.isArray(o.workouts)||!Array.isArray(o.food)||!Array.isArray(o.body))throw Error('Formato non valido');if(confirm('Sostituire tutti i dati attuali con il backup?')){db=o;db.targets ||= {kcal:2000,protein:145,carbs:215,fat:62};db.appleHealth ||= {days:{},workouts:[],importedAt:null};db.customFoods ||= [];db.foodPrefs ||= {};save();renderSettings()}}catch(e){alert('Backup non valido: '+e.message)}};el('reset').onclick=()=>{if(confirm('Eliminare definitivamente tutti i dati di questo browser?')){localStorage.removeItem(KEY);location.reload()}}}
renderDashboard();</script></body></html>
