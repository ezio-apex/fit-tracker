<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fit Tracker • Allenamento e Nutrizione</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#172235;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#12243d;color:white;padding:22px max(16px,calc((100vw - 1000px)/2))}header h1{margin:0;font-size:26px}header p{margin:6px 0 0;color:#b8cce2}main{max-width:1000px;margin:auto;padding:18px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}button,.btn{border:0;border-radius:10px;padding:10px 14px;background:#dfe8f3;color:#172235;font-weight:650;cursor:pointer}button.active,button.primary{background:#1667bd;color:white}.panel{background:white;border:1px solid #e0e7ef;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 3px 16px #17223509}h2{margin:0 0 14px;font-size:21px}h3{margin:12px 0 8px}label{display:block;font-size:13px;font-weight:600;margin:8px 0 4px}input,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;background:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}.stat{background:#eef5fc;padding:14px;border-radius:12px}.stat b{display:block;font-size:24px}.stat small{color:#5e6b7b}.muted{color:#617184;font-size:13px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.exercise{border-top:1px solid #e8edf4;padding:13px 0}.exercise:first-child{border-top:0}.setrow{display:grid;grid-template-columns:42px 1fr 1fr 1fr;gap:8px;align-items:end;margin:7px 0}.setrow label{margin:0}.setrow input{padding:8px}.foodrow{display:grid;grid-template-columns:2fr 1fr auto;gap:8px;align-items:end}.foodrow button{height:42px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #e8edf4;font-size:14px}th{color:#617184}.danger{background:#fbe4e4;color:#9a2323}.hidden{display:none}progress{width:100%;height:16px;accent-color:#1667bd}footer{font-size:12px;color:#64748b;margin:22px 0}@media(max-width:560px){.setrow{grid-template-columns:28px repeat(3,minmax(0,1fr))}.panel{padding:13px}.foodrow{grid-template-columns:1fr 95px auto}header{padding:20px 16px}}</style></head><body><header><h1>💪 Fit Tracker</h1><p>Allenamento • Alimentazione • Progressi</p></header><main><nav><button data-tab="dashboard" class="active">Riepilogo</button><button data-tab="workout">Allenamento</button><button data-tab="food">Alimentazione</button><button data-tab="body">Misure</button><button data-tab="settings">Dati e obiettivi</button></nav><section id="dashboard"></section><section id="workout" class="hidden"></section><section id="food" class="hidden"></section><section id="body" class="hidden"></section><section id="settings" class="hidden"></section><footer>Valori nutrizionali indicativi: verifica sempre le etichette. I dati sono salvati soltanto in questo browser/dispositivo; usa Esporta backup regolarmente. Nessuna sincronizzazione automatica con ChatGPT.</footer></main><script>
const KEY='fit-tracker-v1';const days=[{name:'Lunedì • Petto e tricipiti A',ex:[['Chest press',3,'6–8',150],['Panca inclinata 30°',3,'6–10',150],['Pec deck',2,'10–15',90],['Pushdown barra',3,'8–12',90],['Tricipiti corda sopra testa',2,'10–15',90]]},{name:'Martedì • Dorso e bicipiti A',ex:[['Rematore macchina',3,'6–10',150],['Lat machine',3,'8–12',120],['Curl manubri panca 45°',3,'8–12',90],['Curl cavo basso',2,'10–15',75],['Scrollate manubri',3,'10–15',90],['Face pull',2,'12–20',75]]},{name:'Giovedì • Petto e tricipiti B',ex:[['Panca inclinata 30°',3,'6–10',150],['Pec deck',3,'10–15',90],['Pushdown corda',3,'8–12',90],['Tricipiti corda sopra testa',2,'10–15',90],['Crunch ai cavi',3,'10–15',60]]},{name:'Venerdì • Dorso e gambe',ex:[['Lat machine',3,'8–12',120],['Rematore petto appoggiato',3,'8–12',120],['Curl martello incrociato',3,'8–12',90],['Scrollate bilanciere',2,'10–15',90],['Leg press',3,'8–12',150],['Leg curl',2,'10–15',90]]}];
const foods=[['Petto di pollo',110,23,0,2],['Fesa di tacchino',105,24,0,1],['Manzo magro',140,21,0,6],['Tonno al naturale sgocciolato',105,24,0,1],['Fiocchi di latte',98,11,3,5],['Ricotta vaccina',146,9,4,10],['Bresaola',151,32,0,2],['Yogurt greco 0%',59,10,4,0],['Whey isolate (stima)',370,85,4,2],['Banana',89,1.1,23,0.3],['Mela',52,0.3,14,0.2],['Uovo sodo',155,13,1,11],['Pasta Protein+ secca (stima)',350,20,60,4],['Pomodori',18,0.9,3.9,0.2],['Insalata',15,1.4,2.9,0.2],['Miele',304,0.3,82,0],['Olio EVO',884,0,0,100]];
const today=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};let db;try{db=JSON.parse(localStorage.getItem(KEY))||{}}catch{db={}}db.workouts ||= [];db.food ||= [];db.body ||= [];db.targets ||= {kcal:2000,protein:145,carbs:215,fat:62};let selectedDay=0,workDate=today(),foodDate=today(),bodyDate=today();const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Impossibile salvare: esporta subito un backup.')}};const el=id=>document.getElementById(id);const num=x=>Number(x)||0;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>Number(n).toLocaleString('it-IT',{maximumFractionDigits:1});function tabs(name){document.querySelectorAll('main section').forEach(e=>e.classList.toggle('hidden',e.id!==name));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));render(name)}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tabs(b.dataset.tab));function render(name){({dashboard:renderDashboard,workout:renderWorkout,food:renderFood,body:renderBody,settings:renderSettings})[name]()}function totals(date){return db.food.filter(f=>f.date===date).reduce((a,f)=>{for(let k of ['kcal','protein','carbs','fat'])a[k]+=num(f[k]);return a},{kcal:0,protein:0,carbs:0,fat:0})}
function renderDashboard(){let t=totals(today()),last=db.body.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];let count=db.workouts.filter(w=>{let d=new Date(w.date+'T12:00:00'),n=new Date();return (n-d)/864e5<=7 && (n-d)/864e5>=0}).length;el('dashboard').innerHTML=`<div class="panel"><h2>Oggi • ${today()}</h2><div class="stats"><div class="stat"><small>Calorie</small><b>${fmt(t.kcal)}</b><small>/ ${db.targets.kcal} kcal</small></div><div class="stat"><small>Proteine</small><b>${fmt(t.protein)} g</b><small>/ ${db.targets.protein} g</small></div><div class="stat"><small>Allenamenti ultimi 7 giorni</small><b>${count}</b><small>sedute registrate</small></div><div class="stat"><small>Ultimo girovita</small><b>${last?.waist?fmt(last.waist)+' cm':'—'}</b><small>${last?.date||'Nessun dato'}</small></div></div><h3>Obiettivi alimentari</h3><label>Calorie</label><progress value="${Math.min(t.kcal,db.targets.kcal)}" max="${db.targets.kcal}"></progress><label>Proteine</label><progress value="${Math.min(t.protein,db.targets.protein)}" max="${db.targets.protein}"></progress></div><div class="panel"><h2>Come usare l'app</h2><p>In <b>Allenamento</b> registri ogni serie, in <b>Alimentazione</b> aggiungi alimenti e grammi, in <b>Misure</b> registri peso e girovita. Puoi esportare i dati e condividerli in chat per analizzarli insieme.</p></div>`}
function renderWorkout(){let day=days[selectedDay];let existing=db.workouts.find(w=>w.date===workDate&&w.day===selectedDay);el('workout').innerHTML=`<div class="panel"><h2>Diario allenamento</h2><div class="grid"><div><label>Data</label><input id="wdate" type="date" value="${workDate}"></div><div><label>Seduta</label><select id="wday">${days.map((d,i)=>`<option value="${i}" ${i===selectedDay?'selected':''}>${esc(d.name)}</option>`).join('')}</select></div></div><p class="muted">Peso in kg per manubrio quando usi i manubri. Inserisci 0 kg per corpo libero. RIR = ripetizioni ancora possibili.</p><div id="exercises">${day.ex.map((e,i)=>`<div class="exercise"><b>${esc(e[0])}</b><div class="muted">${e[1]} serie × ${e[2]} rip. • recupero ${e[3]} s</div>${Array.from({length:e[1]},(_,j)=>{let v=existing?.sets?.[i]?.[j]||{};return `<div class="setrow"><span>${j+1}.</span><div><label>Kg</label><input inputmode="decimal" type="number" step="0.5" min="0" data-e="${i}" data-s="${j}" data-k="kg" value="${v.kg??''}" placeholder="kg"></div><div><label>Rip.</label><input inputmode="numeric" type="number" min="0" data-e="${i}" data-s="${j}" data-k="reps" value="${v.reps??''}" placeholder="rep"></div><div><label>RIR</label><input inputmode="numeric" type="number" min="0" max="10" data-e="${i}" data-s="${j}" data-k="rir" value="${v.rir??''}" placeholder="RIR"></div></div>`}).join('')}</div>`).join('')}</div><button class="primary" id="savework">Salva allenamento</button><span id="wmsg" class="muted"></span></div><div class="panel"><h2>Storico recente</h2><div id="whistory"></div></div>`;el('wdate').onchange=e=>{workDate=e.target.value;renderWorkout()};el('wday').onchange=e=>{selectedDay=+e.target.value;renderWorkout()};el('savework').onclick=()=>{let sets=day.ex.map(e=>Array.from({length:e[1]},()=>({})));el('exercises').querySelectorAll('input').forEach(i=>{if(i.value!=='')sets[+i.dataset.e][+i.dataset.s][i.dataset.k]=num(i.value)});if(!sets.flat().some(s=>s.reps>0)){alert('Inserisci almeno una serie con ripetizioni.');return}db.workouts=db.workouts.filter(w=>!(w.date===workDate&&w.day===selectedDay));db.workouts.push({date:workDate,day:selectedDay,sets});save();renderWorkout();el('wmsg').textContent=' ✓ Salvato'};el('whistory').innerHTML=db.workouts.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,12).map(w=>`<p><b>${w.date}</b> • ${esc(days[w.day]?.name||'Seduta')} • ${w.sets.flat().filter(s=>s.reps>0).length} serie <button data-load="${w.date}|${w.day}">Apri</button></p>`).join('')||'<p class="muted">Nessun allenamento salvato.</p>';el('whistory').querySelectorAll('button').forEach(b=>b.onclick=()=>{[workDate,selectedDay]=b.dataset.load.split('|');selectedDay=+selectedDay;renderWorkout()})}
function renderFood(){let t=totals(foodDate);let entries=db.food.filter(f=>f.date===foodDate);el('food').innerHTML=`<div class="panel"><h2>Diario alimentare</h2><label>Data</label><input id="fdate" type="date" value="${foodDate}"><div class="stats" style="margin-top:12px"><div class="stat"><small>Calorie</small><b>${fmt(t.kcal)}</b><small>su ${db.targets.kcal} kcal</small></div><div class="stat"><small>Proteine</small><b>${fmt(t.protein)} g</b><small>su ${db.targets.protein} g</small></div><div class="stat"><small>Carboidrati</small><b>${fmt(t.carbs)} g</b></div><div class="stat"><small>Grassi</small><b>${fmt(t.fat)} g</b></div></div><h3>Aggiungi alimento</h3><div class="foodrow"><div><label>Alimento</label><select id="foodsel">${foods.map((f,i)=>`<option value="${i}">${esc(f[0])}</option>`).join('')}</select></div><div><label>Grammi</label><input id="grams" type="number" min="1" value="100"></div><button class="primary" id="addfood">Aggiungi</button></div><p class="muted">Valori medi indicativi per 100 g. Per prodotti confezionati, usa i valori dell'etichetta nella voce personalizzata.</p><h3>Alimento personalizzato</h3><div class="grid"><div><label>Nome</label><input id="customname" placeholder="Es. dessert proteico"></div><div><label>Quantità consumata (g)</label><input id="customgrams" type="number" value="100" min="1"></div><div><label>kcal per 100 g</label><input id="customkcal" type="number" min="0"></div><div><label>Proteine / 100 g</label><input id="customprotein" type="number" min="0"></div><div><label>Carboidrati / 100 g</label><input id="customcarbs" type="number" min="0"></div><div><label>Grassi / 100 g</label><input id="customfat" type="number" min="0"></div></div><p><button id="addcustom">Aggiungi personalizzato</button></p></div><div class="panel"><h2>Alimenti registrati</h2><div style="overflow:auto"><table><thead><tr><th>Alimento</th><th>g</th><th>kcal</th><th>Prot.</th><th></th></tr></thead><tbody>${entries.map(f=>`<tr><td>${esc(f.name)}</td><td>${fmt(f.grams)}</td><td>${fmt(f.kcal)}</td><td>${fmt(f.protein)}</td><td><button class="danger" data-remove="${f.id}">×</button></td></tr>`).join('')||'<tr><td colspan="5">Nessun alimento registrato.</td></tr>'}</tbody></table></div></div>`;el('fdate').onchange=e=>{foodDate=e.target.value;renderFood()};const add=(name,g,k,p,c,f)=>{if(!g||g<=0||!name){alert('Inserisci nome e grammi validi');return}db.food.push({id:Date.now()+Math.random(),date:foodDate,name,grams:g,kcal:+(k*g/100).toFixed(1),protein:+(p*g/100).toFixed(1),carbs:+(c*g/100).toFixed(1),fat:+(f*g/100).toFixed(1)});save();renderFood()};el('addfood').onclick=()=>{let f=foods[+el('foodsel').value];add(f[0],num(el('grams').value),...f.slice(1))};el('addcustom').onclick=()=>add(el('customname').value.trim(),num(el('customgrams').value),num(el('customkcal').value),num(el('customprotein').value),num(el('customcarbs').value),num(el('customfat').value));document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{db.food=db.food.filter(f=>String(f.id)!==b.dataset.remove);save();renderFood()})}
function renderBody(){let current=db.body.find(x=>x.date===bodyDate);el('body').innerHTML=`<div class="panel"><h2>Peso e girovita</h2><div class="grid"><div><label>Data</label><input id="bdate" type="date" value="${bodyDate}"></div><div><label>Peso (kg)</label><input id="weight" type="number" step="0.1" min="0" value="${current?.weight??''}"></div><div><label>Girovita (cm)</label><input id="waist" type="number" step="0.1" min="0" value="${current?.waist??''}"></div></div><p><button class="primary" id="savebody">Salva misure</button></p></div><div class="panel"><h2>Storico misure</h2><table><thead><tr><th>Data</th><th>Peso</th><th>Girovita</th></tr></thead><tbody>${db.body.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(b=>`<tr><td>${b.date}</td><td>${b.weight?fmt(b.weight)+' kg':'—'}</td><td>${b.waist?fmt(b.waist)+' cm':'—'}</td></tr>`).join('')||'<tr><td colspan="3">Nessuna misura.</td></tr>'}</tbody></table></div>`;el('bdate').onchange=e=>{bodyDate=e.target.value;renderBody()};el('savebody').onclick=()=>{let weight=num(el('weight').value),waist=num(el('waist').value);if(!weight&&!waist){alert('Inserisci almeno una misura');return}db.body=db.body.filter(b=>b.date!==bodyDate);db.body.push({date:bodyDate,weight,waist});save();renderBody()}}
function renderSettings(){el('settings').innerHTML=`<div class="panel"><h2>Obiettivi giornalieri</h2><div class="grid">${[['kcal','Calorie (kcal)'],['protein','Proteine (g)'],['carbs','Carboidrati (g)'],['fat','Grassi (g)']].map(([k,n])=>`<div><label>${n}</label><input type="number" min="0" id="target-${k}" value="${db.targets[k]}"></div>`).join('')}</div><p><button class="primary" id="savetargets">Salva obiettivi</button></p><p class="muted">Valori iniziali indicativi, da personalizzare in base ai progressi.</p></div><div class="panel"><h2>Backup e condivisione</h2><p>I dati rimangono nel browser. Esporta un file JSON per non perderli e, se vuoi, caricalo in questa chat per farmi analizzare progressi e alimentazione.</p><div class="row"><button class="primary" id="export">Esporta backup JSON</button><label style="margin:0">Importa backup <input id="import" type="file" accept="application/json,.json"></label></div><p class="muted">L'importazione sostituisce i dati attuali. Il file può contenere dati personali: condividilo soltanto se desideri farli analizzare.</p><button class="danger" id="reset">Cancella tutti i dati locali</button></div>`;el('savetargets').onclick=()=>{for(let k of ['kcal','protein','carbs','fat'])db.targets[k]=num(el('target-'+k).value);save();alert('Obiettivi salvati')};el('export').onclick=()=>{let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fit-tracker-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};el('import').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let o=JSON.parse(await f.text());if(!Array.isArray(o.workouts)||!Array.isArray(o.food)||!Array.isArray(o.body))throw Error('Formato non valido');if(confirm('Sostituire tutti i dati attuali con il backup?')){db=o;db.targets ||= {kcal:2000,protein:145,carbs:215,fat:62};save();renderSettings()}}catch(e){alert('Backup non valido: '+e.message)}};el('reset').onclick=()=>{if(confirm('Eliminare definitivamente tutti i dati di questo browser?')){localStorage.removeItem(KEY);location.reload()}}}
renderDashboard();</script></body></html>
